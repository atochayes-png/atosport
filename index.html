<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>ATOSPORT - Plataforma de Gestión Deportiva</title>
    <meta name="description" content="SaaS de Alto Rendimiento para Gestión de Ligas, Torneos, Cédulas Arbitrales y Marcadores en Tiempo Real." />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile PWA & iOS Meta Tags -->
    <meta name="theme-color" content="#070A0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ATOSPORT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ATOSPORT" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(
            function(registration) {
              console.log('ATOSPORT ServiceWorker registrado con alcance: ', registration.scope);
            },
            function(err) {
              console.warn('ATOSPORT ServiceWorker fallo al registrarse: ', err);
            }
          );
        });
      }
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Anti-flicker Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('atosport_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 dark:bg-[#070A0F] dark:text-[#E2E8F0] antialiased transition-colors duration-200 selection:bg-emerald-500/20 selection:text-emerald-500">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
